<nav
  *ngIf="!user()"
  class="h-16 px-8 bg-white border-b border-gray-100 flex items-center justify-between sticky top-0 z-50"
>
  <div class="flex items-center gap-2">
    <span class="font-bold text-gray-900 tracking-tight text-xl">Diet Smart</span>
  </div>
  <div class="flex items-center gap-6">
    <a
      routerLink="/"
      routerLinkActive="active-link"
      class="text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors"
      >Home</a
    >
    <a
      routerLink="/signup"
      routerLinkActive="active-link"
      class="text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors"
      >Sign Up</a
    >
    <a
      routerLink="/signin"
      routerLinkActive="active-link"
      class="bg-gray-900 text-white px-5 py-2 rounded-xl text-sm font-bold hover:bg-gray-800 transition-all shadow-md"
      >Sign In</a
    >
  </div>
</nav>

<header
  *ngIf="user()"
  class="h-16 border-b border-gray-200 bg-white px-6 flex items-center justify-between fixed top-0 left-0 right-0 z-30 shadow-sm"
>
  <div class="hidden md:flex items-center relative w-96">
    <lucide-icon [name]="SearchIcon" class="w-4 h-4 absolute left-3 text-gray-400"></lucide-icon>
    <input
      type="text"
      placeholder="Search nutrition data..."
      class="w-full pl-10 pr-4 py-2 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-mint-500/20 focus:border-mint-500 transition-all"
    />
  </div>

  <div class="flex items-center gap-4">
    <button class="p-2 text-gray-500 hover:bg-gray-100 rounded-lg relative transition-colors">
      <lucide-icon [name]="BellIcon" class="w-5 h-5"></lucide-icon>
      <span
        class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full border-2 border-white"
      ></span>
    </button>
    <div class="h-8 w-px bg-gray-200 mx-2"></div>
    <div class="flex items-center gap-3 group">
      <div class="text-right hidden sm:block">
        <p class="text-sm font-bold text-gray-800 leading-none mb-1">{{ user()?.userName }}</p>
        <p class="text-[10px] font-medium text-mint-600 uppercase tracking-wider">
          {{ user()?.plan || 'Free Plan' }}
        </p>
      </div>
      <div
        class="w-9 h-9 rounded-lg bg-gradient-to-br from-mint-500 to-mint-600 flex items-center justify-center text-white font-bold shadow-sm shadow-mint-100"
      >
        {{ initials() }}
      </div>
      <button
        (click)="logout()"
        class="ml-2 p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-all"
        title="Logout"
      >
        <lucide-icon [name]="LogOutIcon" class="w-4 h-4"></lucide-icon>
      </button>
    </div>
  </div>
</header>

<main [class.pt-16]="user()" class="min-h-screen transition-all duration-300">
  <router-outlet></router-outlet>
</main>
