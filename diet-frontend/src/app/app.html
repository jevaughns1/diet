<nav
  *ngIf="!user()"
  class="h-16 px-8 bg-white border-b border-gray-100 flex items-center justify-between sticky top-0 z-50"
>
  <div class="flex items-center gap-2">
    <span class="font-bold text-gray-900 tracking-tight text-xl">Diet Smart</span>
  </div>
  <div class="flex items-center gap-6">
    <a
      routerLink="/"
      routerLinkActive="active-link"
      class="text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors"
      >Home</a
    >
    <a
      routerLink="/signup"
      routerLinkActive="active-link"
      class="text-sm font-medium text-gray-500 hover:text-gray-900 transition-colors"
      >Sign Up</a
    >
    <a
      routerLink="/signin"
      routerLinkActive="active-link"
      class="bg-gray-900 text-white px-5 py-2 rounded-xl text-sm font-bold hover:bg-gray-800 transition-all shadow-md"
      >Sign In</a
    >
  </div>
</nav>
<header
  *ngIf="user()"
  class="h-16 border-b border-gray-200 bg-white px-8 flex items-center justify-between fixed top-0 left-0 right-0 z-30 shadow-sm"
>
  <div class="flex items-center gap-2">
    <div class="w-8 h-8 rounded-lg bg-mint-600 flex items-center justify-center lg:hidden">
      <span class="text-white text-xs font-bold">DS</span>
    </div>
    <h1 class="text-lg font-bold text-gray-800 tracking-tight hidden sm:block">Overview</h1>
  </div>

  <div class="flex items-center gap-3">
    <button
      class="p-2 text-gray-500 hover:bg-gray-50 rounded-xl relative transition-all active:scale-95"
    >
      <lucide-icon [name]="BellIcon" class="w-5 h-5"></lucide-icon>
      <span
        class="absolute top-2.5 right-2.5 w-2 h-2 bg-red-500 rounded-full border-2 border-white"
      ></span>
    </button>

    <div class="h-6 w-px bg-gray-200 mx-1"></div>

    <div class="flex items-center gap-3 pl-1">
      <div class="text-right hidden sm:block">
        <p class="text-sm font-bold text-gray-900 leading-tight">{{ user()?.userName }}</p>
        <div class="flex items-center justify-end gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-mint-500"></span>
          <p class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">
            {{ user()?.plan || 'Free' }}
          </p>
        </div>
      </div>

      <div
        class="w-10 h-10 rounded-xl bg-gray-900 flex items-center justify-center text-white text-sm font-bold shadow-md shadow-gray-200 border border-gray-800"
      >
        {{ initials() }}
      </div>

      <button
        (click)="logout()"
        class="ml-1 p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-xl transition-all"
        title="Logout"
      >
        <lucide-icon [name]="LogOutIcon" class="w-4 h-4"></lucide-icon>
      </button>
    </div>
  </div>
</header>

<main [class.pt-16]="user()" class="min-h-screen transition-all duration-300">
  <router-outlet></router-outlet>
</main>
