<div class="meal-timeline bg-white rounded-2xl p-8 shadow-sm border border-gray-100">
  <h3 class="text-lg font-semibold text-gray-800 mb-6">Today's Meals</h3>
  <div class="space-y-4">
    <div *ngFor="let meal of meals; let i = index" class="relative">
      <!-- Timeline connector -->
      <div
        *ngIf="i < meals.length - 1"
        class="absolute left-5 top-16 bottom-0 w-0.5 bg-gray-200 -mb-4"
      ></div>
      <!-- Meal card -->
      <div class="bg-gray-50 rounded-xl p-5 hover:bg-gray-100 transition-colors cursor-pointer">
        <div class="flex items-start gap-4">
          <!-- Icon -->
          <div
            class="w-10 h-10 rounded-full bg-mint-500 flex items-center justify-center flex-shrink-0 relative z-10"
          >
            <span class="lucide-utensils w-5 h-5 text-white"></span>
          </div>
          <!-- Content -->
          <div class="flex-1">
            <div class="flex items-center justify-between mb-2">
              <h4 class="font-semibold text-gray-800 text-base">{{ meal.mealType }}</h4>
              <div class="flex items-center gap-1.5 text-sm text-gray-500">
                <span class="lucide-clock w-4 h-4"></span>
                <span>{{ meal.time }}</span>
              </div>
            </div>
            <!-- Food items -->
            <div class="text-sm text-gray-600 mb-3">
              {{ meal.items.join(', ') }}
            </div>
            <!-- Tags -->
            <div class="flex gap-2">
              <span
                *ngFor="let tag of meal.tags"
                class="text-xs px-3 py-1.5 rounded-lg font-medium"
                [ngClass]="tag.color"
              >
                {{ tag.text }}
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
