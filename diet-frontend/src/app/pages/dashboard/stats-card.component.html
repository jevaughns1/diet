<div class="bg-white rounded-2xl p-6 shadow-sm border border-gray-100">
  <div class="flex items-start justify-between mb-4">
    <div class="text-sm text-gray-500 font-medium">{{ title }}</div>
    <div [class]="'w-10 h-10 rounded-xl flex items-center justify-center ' + containerClass">
      <lucide-icon [name]="icon" class="w-5 h-5"></lucide-icon>
    </div>
  </div>

  <div class="text-3xl font-bold text-gray-800 mb-1">{{ value }}g</div>

  <div class="text-sm text-gray-400 font-medium">{{ subtitle }}g of daily goal</div>
</div>
