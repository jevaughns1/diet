<aside class="sidebar w-64 bg-white border-r border-gray-200 px-4 py-6">
  <nav class="space-y-1">
    <button
      *ngFor="let item of navItems"
      class="w-full flex items-center gap-3 px-4 py-3 rounded-xl transition-all"
      [ngClass]="
        item.active
          ? 'bg-gradient-to-r from-mint-500 to-mint-600 text-white shadow-md'
          : 'text-gray-600 hover:bg-gray-50'
      "
    >
      <span [ngClass]="item.icon" class="icon w-5 h-5"></span>
      <span class="font-medium">{{ item.label }}</span>
    </button>
  </nav>
  <div
    class="mt-8 p-4 bg-gradient-to-br from-orange-50 to-orange-100 rounded-xl border border-orange-200"
  >
    <h4 class="font-semibold text-gray-800 mb-2">Daily Tip</h4>
    <p class="text-sm text-gray-700">
      Eating protein within 30 minutes post-workout maximizes muscle growth!
    </p>
  </div>
</aside>
