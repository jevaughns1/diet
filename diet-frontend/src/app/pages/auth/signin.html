<div class="auth-card">
  <h2 class="auth-title">Sign In</h2>
  <form style="display: flex; flex-direction: column; gap: 1rem" (ngSubmit)="signin()" novalidate>
    <label>Username</label>
    <input
      type="text"
      [(ngModel)]="credentials.userName"
      name="userName"
      required
      placeholder="Enter your username"
    />
    <label>Password</label>
    <input
      type="password"
      [(ngModel)]="credentials.password"
      name="password"
      required
      placeholder="Enter your password"
    />
    <button type="submit"><strong>Sign In</strong></button>
  </form>
  <div *ngIf="error" class="auth-error">{{ error }}</div>
  <div *ngIf="success" class="auth-success">{{ success }}</div>
</div>
